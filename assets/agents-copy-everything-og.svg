<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">agents copy everything</title>
  <desc id="desc">A five-rung ladder from codebase down to style guide, with a crossed-out code comment beside the article title.</desc>
  <rect width="1200" height="630" fill="#0d0f0c"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#22261f" stroke-width="2"/>

  <text x="70" y="78" fill="#9ece6a" font-family="SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">SHITRAT.AI / LOG</text>

  <text x="68" y="182" fill="#ffffff" font-family="SFMono-Semibold, Menlo, monospace" font-size="66" font-weight="700" letter-spacing="-2">agents copy</text>
  <text x="68" y="258" fill="#ffffff" font-family="SFMono-Semibold, Menlo, monospace" font-size="66" font-weight="700" letter-spacing="-2">everything</text>

  <text x="70" y="352" fill="#9aa291" font-family="SFMono-Regular, Menlo, monospace" font-size="27">So the comments had to go,</text>
  <text x="70" y="394" fill="#9aa291" font-family="SFMono-Regular, Menlo, monospace" font-size="27">and the rules moved into code.</text>

  <g font-family="SFMono-Regular, Menlo, monospace">
    <text x="70" y="500" fill="#6f7769" font-size="26">// explains the workaround</text>
    <line x1="64" y1="491" x2="498" y2="491" stroke="#f7768e" stroke-width="5" stroke-linecap="round"/>
    <text x="70" y="572" fill="#9ece6a" font-size="24">fix the rung, not the prose</text>
  </g>

  <g transform="translate(690 96)" font-family="SFMono-Regular, Menlo, monospace">
    <text x="0" y="0" fill="#6f7769" font-size="16" letter-spacing="1">WHERE A CORRECTION LIVES</text>

    <line x1="40" y1="24" x2="40" y2="452" stroke="#3a4135" stroke-width="8" stroke-linecap="round"/>
    <line x1="340" y1="24" x2="340" y2="452" stroke="#3a4135" stroke-width="8" stroke-linecap="round"/>

    <g stroke-width="8" stroke-linecap="round">
      <line x1="40" y1="68" x2="340" y2="68" stroke="#9ece6a"/>
      <line x1="40" y1="158" x2="340" y2="158" stroke="#9ece6a"/>
      <line x1="40" y1="248" x2="340" y2="248" stroke="#3a4135"/>
      <line x1="40" y1="338" x2="340" y2="338" stroke="#3a4135"/>
      <line x1="40" y1="428" x2="340" y2="428" stroke="#3a4135"/>
    </g>

    <g font-size="21" text-anchor="middle">
      <text x="190" y="104" fill="#ffffff" font-weight="700">codebase</text>
      <text x="190" y="194" fill="#ffffff" font-weight="700">lint · compiler · CI</text>
      <text x="190" y="284" fill="#9aa291">rules</text>
      <text x="190" y="374" fill="#9aa291">skills</text>
      <text x="190" y="464" fill="#6f7769">style guide</text>
    </g>

    <text x="370" y="120" fill="#9ece6a" font-size="18">fails</text>
    <text x="370" y="370" fill="#6f7769" font-size="18">asks</text>
  </g>

  <text x="1128" y="586" font-size="34" text-anchor="end">🐀</text>
</svg>
