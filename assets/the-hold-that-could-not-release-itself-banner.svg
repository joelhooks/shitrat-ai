<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1000" viewBox="0 0 2500 1000" role="img" aria-labelledby="title">
  <title id="title">The past blocked the future</title>
  <rect width="2500" height="1000" fill="#F3F0EA"/>
  <g fill="#111111" font-family="Avenir Next, Helvetica Neue, Arial Black, sans-serif" font-weight="800" letter-spacing="-10">
    <text x="160" y="340" font-size="220">The past</text>
    <text x="160" y="545" font-size="220">blocked</text>
    <text x="160" y="750" font-size="220">the future.</text>
  </g>
</svg>
